name: Cloud Trading Harness (Unlimited Minutes)

on:
  schedule:
    # Session 1: 00:15 WAT (23:15 UTC previous day Sun-Thu)
    - cron: '15 23 * * 0-4'
    # Session 2: 06:00 WAT (05:00 UTC Mon-Fri)
    - cron: '0 5 * * 1-5'
    # Session 3: 11:45 WAT (10:45 UTC Mon-Fri)
    - cron: '45 10 * * 1-5'
    # Session 4: 17:15 WAT (16:15 UTC Mon-Fri)
    - cron: '15 16 * * 1-5'
  repository_dispatch:
    types: [engine_updated, trigger_session]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run (bypass weekend/holiday checks)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Simulation mode (--dry-run)'
        required: false
        default: false
        type: boolean
      target_account:
        description: 'Single target account (e.g. personal_cent) or empty for all'
        required: false
        default: ''
        type: string

concurrency:
  group: mt5-cloud-session
  cancel-in-progress: true

jobs:
  run-trading-session:
    name: Headless MT5 Multi-Account Session
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Harness
        uses: actions/checkout@v4

      - name: Set up Environment & Auth
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          echo "$PRIVATE_REPO_TOKEN" | gh auth login --with-token
          gh auth status

      - name: Cache Modern Wine MT5 Baselines
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mt5_exness_wine
            ~/.cache/mt5_universal_wine
          key: mt5-wine-builds-${{ runner.os }}-v1
          restore-keys: |
            mt5-wine-builds-${{ runner.os }}-

      - name: Execute Live Trading Session (OTA Binary)
        env:
          CONTROL_WORKER_URL: ${{ secrets.CONTROL_WORKER_URL || 'https://mt5-control-studio.zapstream.workers.dev' }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force || github.event.client_payload.force || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
          TARGET_ACCOUNT: ${{ inputs.target_account || github.event.client_payload.target_account || '' }}
        run: |
          bash scripts/cloud_start_harness.sh

