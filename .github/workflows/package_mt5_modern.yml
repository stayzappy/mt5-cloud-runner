name: Package Modern MT5 Build

on:
  workflow_dispatch:

jobs:
  build-mt5-tarball:
    name: Build & Release Modern MT5 Package (Windows Native)
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Harness
        uses: actions/checkout@v4

      - name: Download Official MT5 Setup
        shell: bash
        run: |
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o mt5setup.exe "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          ls -lh mt5setup.exe

      - name: Install MetaTrader 5 Natively (/auto)
        shell: pwsh
        run: |
          Write-Host "Running native silent installer on Windows..."
          $proc = Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" -PassThru
          $proc.WaitForExit(90000)
          Write-Host "Installer finished. Waiting 5s for disk sync..."
          Start-Sleep -Seconds 5
          Stop-Process -Name "terminal64" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "mt5setup" -Force -ErrorAction SilentlyContinue

      - name: Verify Installed Files & Version
        shell: pwsh
        run: |
          $mt5Dir = "C:\Program Files\MetaTrader 5"
          if (-not (Test-Path "$mt5Dir\terminal64.exe")) {
            Write-Error "terminal64.exe not found in $mt5Dir!"
            exit 1
          }
          $item = Get-Item "$mt5Dir\terminal64.exe"
          Write-Host "Found terminal64.exe (Size: $($item.Length) bytes)"
          $versionInfo = $item.VersionInfo
          Write-Host "Product Version: $($versionInfo.ProductVersion)"
          Write-Host "File Version: $($versionInfo.FileVersion)"

      - name: Archive and Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          cd "C:/Program Files/MetaTrader 5"
          tar -czf "$GITHUB_WORKSPACE/mt5_modern_build.tar.gz" .
          cd "$GITHUB_WORKSPACE"
          ls -lh mt5_modern_build.tar.gz
          gh release upload latest-engine mt5_modern_build.tar.gz \
            --repo stayzappy/mt5-forex-bot \
            --clobber
          echo "Successfully uploaded native modern MT5 build to release!"
